name: jbang-help-real-screenshots

on:
  workflow_dispatch:
  push:

jobs:
  shots:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup JBang
        uses: jbangdev/setup-jbang@v0.1.1

      # ---------------- LINUX (real Xvfb desktop + ImageMagick import) ----------------
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xterm imagemagick

      - name: Create desktop screenshot (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 1

          xterm -geometry 120x40 -fa Monospace -fs 12 -e bash -lc \
            "jbang --help; echo; echo '[xterm] holding for screenshot...'; sleep 5" &
          sleep 1

          import -silent -window root desktop-Linux.png
          ls -la desktop-Linux.png

      # ---------------- macOS (best effort) ----------------
      - name: Create desktop screenshot (macOS)
        if: runner.os == 'macOS'
        shell: bash
        continue-on-error: true
        run: |
          # Try to open Terminal without AppleEvents
          cat > jbang-help.command <<'EOF'
          #!/bin/bash
          jbang --help
          echo
          echo "[Terminal] holding for screenshot..."
          sleep 5
          EOF
          chmod +x jbang-help.command
          open -a Terminal ./jbang-help.command
          sleep 2

          # Best effort: may fail on hosted runners if no display session exists
          screencapture -x desktop-macOS.png
          ls -la desktop-macOS.png

      # ---------------- WINDOWS (real desktop via .NET) ----------------
      - name: Create desktop screenshot (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process cmd.exe -ArgumentList '/k', 'jbang --help & echo. & echo [cmd] holding for screenshot... & timeout /t 5'
          Start-Sleep -Seconds 1

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.X, $bounds.Y, 0, 0, $bmp.Size)
          $bmp.Save("desktop-Windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose()
          $bmp.Dispose()
          dir desktop-Windows.png

      # ---------------- Upload (with retry-ish behavior) ----------------
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: desktop-${{ runner.os }}.png
          if-no-files-found: warn
          retention-days: 3