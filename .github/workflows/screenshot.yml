name: jbang-help-real-desktop-screenshots

on:
  workflow_dispatch:
  push:

# ------------------------------------------------------------
# Central timing knobs (edit here, not inside scripts)
#
# If screenshots are blank/empty:
# - increase WINDOW_APPEAR_DELAY (terminal window appears later than expected)
# - increase TERMINAL_HOLD_TIME (terminal closes before we capture)
# ------------------------------------------------------------
env:
  WINDOW_APPEAR_DELAY: 5      # seconds to wait after launching the terminal window
  TERMINAL_HOLD_TIME: 12      # seconds the terminal stays open after printing output

jobs:
  screenshot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    # Helps artifact upload be less flaky in some repos/org settings.
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup JBang
        uses: jbangdev/setup-jbang@v0.1.1

      # ============================================================
      # LINUX: Xvfb provides a real (virtual) desktop that ImageMagick
      # can screenshot. We open xterm on that desktop and run jbang.
      #
      # IMPORTANT: use absolute path to jbang, because GUI processes
      # can have a different PATH than the non-GUI workflow shell.
      # ============================================================
      - name: Install GUI + screenshot deps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xterm imagemagick

      - name: Run jbang --help in xterm and screenshot desktop (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          JBANG_PATH="$(command -v jbang)"
          echo "JBANG_PATH=$JBANG_PATH"

          # Start a virtual X desktop
          Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 1

          # -hold keeps xterm open so output is still visible when we capture.
          xterm -hold -geometry 120x40 -fa Monospace -fs 14 -bg black -fg white \
            -e bash -lc "
              echo '===== RUNNING JBANG HELP =====';
              echo 'jbang path: $JBANG_PATH';
              echo;
              '$JBANG_PATH' --help;
              echo;
              echo '===== DONE (holding) =====';
              sleep ${TERMINAL_HOLD_TIME}
            " &

          # Give the window time to appear and paint text.
          sleep ${WINDOW_APPEAR_DELAY}

          # Screenshot the virtual desktop root window
          import -silent -window root desktop-Linux.png
          ls -la desktop-Linux.png

      # ============================================================
      # macOS: Avoid AppleScript (often blocked by runner privacy/TCC).
      # Instead, create a .command file and open it with Terminal.
      #
      # IMPORTANT: embed absolute jbang path; Terminal may not inherit
      # the same PATH as the workflow step.
      # ============================================================
      - name: Run jbang --help in Terminal and screenshot desktop (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          JBANG_PATH="$(command -v jbang)"
          echo "JBANG_PATH=$JBANG_PATH"

          cat > jbang-help.command <<EOF
          #!/bin/bash
          echo "===== RUNNING JBANG HELP ====="
          echo "jbang path: $JBANG_PATH"
          echo
          "$JBANG_PATH" --help
          echo
          echo "===== DONE (holding) ====="
          sleep ${TERMINAL_HOLD_TIME}
          EOF

          chmod +x jbang-help.command

          # Launch a real Terminal window
          open -a Terminal ./jbang-help.command

          # Give Terminal time to appear and paint text.
          sleep ${WINDOW_APPEAR_DELAY}

          # Full desktop screenshot (includes Terminal)
          screencapture -x desktop-macOS.png
          ls -la desktop-macOS.png

      # ============================================================
      # WINDOWS: Start a real cmd.exe window, run jbang, keep it open,
      # then take a desktop screenshot via .NET.
      #
      # IMPORTANT: resolve absolute jbang path; GUI cmd.exe may not see
      # the same PATH as the workflow shell.
      # ============================================================
      - name: Run jbang --help in cmd.exe and screenshot desktop (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # IMPORTANT:
          # On Windows `Get-Command jbang` may resolve to jbang.ps1 (PowerShell shim).
          # When launched from cmd.exe, .ps1 can be "opened" by file association (Notepad)
          # rather than executed. Force the cmd wrapper instead.
          $jbangCmd = (Get-Command jbang.cmd -ErrorAction Stop).Source
          Write-Host "JBANG CMD: $jbangCmd"

          $cmdFile = Join-Path $env:RUNNER_TEMP "jbang-help.cmd"

          @"
          @echo off
          mode con: cols=120 lines=40
          echo ===== RUNNING JBANG HELP =====
          echo jbang cmd path: $jbangCmd
          echo.
          call "$jbangCmd" --help
          echo.
          echo ===== DONE (holding) =====
          timeout /t %TERMINAL_HOLD_TIME%
          "@ | Set-Content -Path $cmdFile -Encoding ASCII

          # Run our .cmd in a real window and keep it open (/k)
          Start-Process cmd.exe -ArgumentList '/k', "`"$cmdFile`""

          Start-Sleep -Seconds $env:WINDOW_APPEAR_DELAY

          # Screenshot desktop
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.X, $bounds.Y, 0, 0, $bmp.Size)
          $bmp.Save("desktop-Windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose()
          $bmp.Dispose()

      # ============================================================
      # Upload: one artifact per OS
      # ============================================================
      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: desktop-${{ runner.os }}.png
          retention-days: 7
          if-no-files-found: error