name: jbang-help-real-desktop-screenshots

on:
  workflow_dispatch:
  push:

# ------------------------------------------------------------
# Centralized timing knobs.
# If screenshots are blank or partially rendered:
#   - increase WINDOW_APPEAR_DELAY
#   - increase HOLD_BEFORE_SCREENSHOT
#   - increase TERMINAL_HOLD_TIME
# ------------------------------------------------------------
env:
  WINDOW_APPEAR_DELAY: 4          # seconds to wait for terminal window to appear
  HOLD_BEFORE_SCREENSHOT: 4       # seconds to wait before taking screenshot
  TERMINAL_HOLD_TIME: 10          # how long the terminal stays open after output

jobs:
  screenshot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup JBang
        uses: jbangdev/setup-jbang@v0.1.1

      # ------------------------------------------------------------
      # LINUX
      # ------------------------------------------------------------
      - name: Install GUI + screenshot deps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xterm imagemagick

      - name: Run jbang --help in xterm and screenshot desktop (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          JBANG_PATH="$(command -v jbang)"
          echo "JBANG_PATH=$JBANG_PATH"

          Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 1

          xterm -hold -geometry 120x40 -fa Monospace -fs 14 -bg black -fg white \
            -e bash -lc "
              echo '===== RUNNING JBANG HELP =====';
              echo 'jbang path: $JBANG_PATH';
              echo;
              '$JBANG_PATH' --help;
              echo;
              echo '===== DONE (holding) =====';
              sleep ${TERMINAL_HOLD_TIME}
            " &

          sleep ${WINDOW_APPEAR_DELAY}

          import -silent -window root desktop-Linux.png
          ls -la desktop-Linux.png

      # ------------------------------------------------------------
      # macOS
      # ------------------------------------------------------------
      - name: Run jbang --help in Terminal and screenshot desktop (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          JBANG_PATH="$(command -v jbang)"
          echo "JBANG_PATH=$JBANG_PATH"

          cat > jbang-help.command <<EOF
          #!/bin/bash
          echo "===== RUNNING JBANG HELP ====="
          echo "jbang path: $JBANG_PATH"
          echo
          "$JBANG_PATH" --help
          echo
          echo "===== DONE (holding) ====="
          sleep ${TERMINAL_HOLD_TIME}
          EOF

          chmod +x jbang-help.command
          open -a Terminal ./jbang-help.command

          sleep ${WINDOW_APPEAR_DELAY}

          screencapture -x desktop-macOS.png
          ls -la desktop-macOS.png

      # ------------------------------------------------------------
      # WINDOWS
      # ------------------------------------------------------------
      - name: Run jbang --help in cmd.exe and screenshot desktop (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $jbang = (Get-Command jbang).Source
          Write-Host "JBANG: $jbang"

          $cmd = @"
          mode con: cols=120 lines=40 ^
          & echo ===== RUNNING JBANG HELP ===== ^
          & echo jbang path: $jbang ^
          & echo. ^
          & `"$jbang`" --help ^
          & echo. ^
          & echo ===== DONE (holding) ===== ^
          & timeout /t $env:TERMINAL_HOLD_TIME
"@

          Start-Process cmd.exe -ArgumentList '/k', $cmd

          Start-Sleep -Seconds $env:WINDOW_APPEAR_DELAY

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.X, $bounds.Y, 0, 0, $bmp.Size)
          $bmp.Save("desktop-Windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose()
          $bmp.Dispose()

          Get-ChildItem desktop-Windows.png | Format-List

      # ------------------------------------------------------------
      # Upload artifacts
      # ------------------------------------------------------------
      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: desktop-${{ runner.os }}.png
          retention-days: 7
          if-no-files-found: error
          