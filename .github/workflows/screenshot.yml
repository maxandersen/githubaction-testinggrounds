name: jbang-help-real-screenshot

on:
  workflow_dispatch:
  push:

jobs:
  screenshot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    # Helps with upload-artifact / actions APIs on some repos
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup JBang
        uses: jbangdev/setup-jbang@v0.1.1

      # ---------- Linux ----------
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xterm imagemagick x11-xserver-utils

      - name: Launch terminal (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 1
          DISPLAY=:99 xterm -geometry 120x40 -fa Monospace -fs 12 -e bash -lc \
            "jbang --help; echo; echo '[xterm] holding for screenshot...'; sleep 20" &
          sleep 2

      # ---------- macOS (no osascript) ----------
      - name: Launch Terminal via .command (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cat > jbang-help.command <<'EOF'
          #!/bin/bash
          set -e
          jbang --help
          echo
          echo "[Terminal] holding for screenshot..."
          sleep 20
          EOF
          chmod +x jbang-help.command
          open -a Terminal ./jbang-help.command
          sleep 2

      # ---------- Windows ----------
      - name: Launch cmd.exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process cmd.exe -ArgumentList '/k', 'jbang --help & echo. & echo [cmd] holding for screenshot... & timeout /t 20'
          Start-Sleep -Seconds 2

      # ---------- Screenshot ----------
      - name: Take desktop screenshot
        uses: OrbitalOwen/desktop-screenshot-action@0.1
        with:
          file-name: desktop-${{ runner.os }}.jpg

      - name: Verify screenshot exists
        shell: bash
        run: |
          ls -la

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: desktop-${{ runner.os }}.jpg
          retention-days: 3